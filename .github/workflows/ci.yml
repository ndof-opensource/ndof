# CI for the ndof libraries. Every library under libs/ is built, tested,
# analyzed, and packaged on every push to main and every pull request.
#
# Jobs process the libraries in dependency order, computed by
# scripts/build.sh --list from each conanfile's requires. The Linux build jobs run scripts/build.sh in its
# default mode, which packages each ndof dependency into the runner's Conan
# cache before a dependent builds, so a library is always tested against
# the packaged form of its dependencies. The Linux jobs run inside the dev image pinned in
# .devcontainer/devcontainer.json (digest-sync reads it, so CI and the
# editor both use the same container image); macOS and Windows run on native runners
# with pinned tools and are the portability enforcers.
#
# Container jobs run with --user root: the runner's work directories belong
# to the host runner user, which the image's non-root dev user cannot write.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Tool versions for the native macOS/Windows jobs. They must equal the
  # versions image/Dockerfile installs into the dev image; the format job
  # checks that.
  CONAN_VERSION: 2.9.2
  CMAKE_VERSION: 3.30.5
  NINJA_VERSION: 1.11.1.1

jobs:
  digest-sync:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the image pin from devcontainer.json
        id: read
        # devcontainer.json is JSONC (comments allowed), so extract with sed
        # rather than a strict JSON parser.
        run: |
          devc_image=$(sed -n 's/^[[:space:]]*"image":[[:space:]]*"\([^"]*\)".*/\1/p' .devcontainer/devcontainer.json | head -n 1)
          if [[ -z "$devc_image" ]]; then
            echo '::error file=.devcontainer/devcontainer.json::no "image" entry found; the dev environment is pinned here'
            exit 1
          fi
          echo "image=$devc_image" >> "$GITHUB_OUTPUT"
          echo "environment: $devc_image"

  format:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 fetches the full history, including tags and branches,
          # which are needed by the versioning checks.
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run -Werror
      # The shipped implementation tier is spelled details/ (decision 14 in
      # docs/decisions.md). Sibling conventions from other projects (detail/,
      # internal/) and case variants are rejected programmatically, so a
      # mistyped directory fails CI instead of waiting for review to notice.
      - name: Header layout naming (decision 14)
        run: |
          bad=$(find libs/*/include -type d \( -iname detail -o -iname internal -o \( -iname details ! -name details \) \) 2>/dev/null || true)
          if [[ -n "$bad" ]]; then
            echo "::error::wrong implementation-tier directory name(s): $bad. Use details/ (decision 14)."
            exit 1
          fi
      # Every header opens with a named include guard, NDOF_<LIB>_<FILE>_HPP
      # (the team standard; #pragma once is not used). Checked by name to
      # ensure all guard names are consistent, and so a guard copied from
      # one header to another doesn't collide, preventing inclusion of the
      # second header that uses the same guard name.
      - name: Header include guards
        run: |
          fail=0
          for f in $(git ls-files 'libs/*/include/ndof/*/*.hpp' 'libs/*/include/ndof/*/**/*.hpp'); do
            rel=${f#libs/*/include/ndof/}
            want="NDOF_$(echo "${rel%.hpp}" | tr '/a-z' '_A-Z')_HPP"
            if ! grep -qxF "#ifndef $want" "$f" || ! grep -qxF "#define $want" "$f"; then
              echo "::error file=$f::expected include guard $want (#ifndef/#define) at the top"
              fail=1
            fi
          done
          exit $fail
      # This task enforces two rules.
      # (1) A requires on another ndof library must name the
      # same version as in that other library's conanfile.
      # (2) A PR that changes a library's packaged files (CMakeLists.txt,
      # CMakePresets.json, cmake/, include/, src/, tests/, conanfile.py)
      # while its version still equals its latest release tag must also
      # bump the version. README changes do not count.
      # A library's CMake project(VERSION) must equal its conanfile version;
      # both are bumped together.
      - name: Versions and requires track the tree (decision 18)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version_of() {
            python3 -c "import re,sys; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open(sys.argv[1]).read()).group(1))" "libs/$1/conanfile.py"
          }
          cmake_version_of() {
            python3 -c "import re,sys; print(re.search(r'project\s*\(\s*\S+\s+VERSION\s+(\S+)', open(sys.argv[1]).read()).group(1))" "libs/$1/CMakeLists.txt"
          }
          fail=0
          for lib in $LIBS; do
            v=$(version_of "$lib")
            cv=$(cmake_version_of "$lib")
            if [[ "$cv" != "$v" ]]; then
              echo "::error file=libs/$lib/CMakeLists.txt::project(VERSION $cv) differs from conanfile.py version $v; the two must be bumped together"
              fail=1
            fi
            for ref in $(grep -oE 'requires\("ndof-[a-z0-9-]+/[^"]+"\)' "libs/$lib/conanfile.py" | sed -E 's/.*\("([^"]+)"\).*/\1/' || true); do
              dep=${ref#ndof-}; dep=${dep%%/*}; want=${ref#*/}
              if [[ ! -f "libs/$dep/conanfile.py" ]]; then
                echo "::error file=libs/$lib/conanfile.py::requires $ref, but there is no libs/$dep"
                fail=1; continue
              fi
              have=$(version_of "$dep")
              if [[ "$want" != "$have" ]]; then
                echo "::error file=libs/$lib/conanfile.py::requires $ref, but libs/$dep is at $have; a requires names the in-tree version"
                fail=1
              fi
            done
            latest=$(git tag -l "$lib/v*" | sed "s|^$lib/v||" | sort -V | tail -n 1)
            [[ -z "$latest" ]] && continue
            if [[ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n 1)" != "$v" ]]; then
              echo "::error file=libs/$lib/conanfile.py::version $v is behind the latest release $lib/v$latest"
              fail=1; continue
            fi
            [[ -z "$BASE_REF" ]] && continue
            if [[ "$v" == "$latest" ]]; then
              changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
                "libs/$lib/CMakeLists.txt" "libs/$lib/CMakePresets.json" "libs/$lib/cmake" \
                "libs/$lib/include" "libs/$lib/src" "libs/$lib/tests" "libs/$lib/conanfile.py")
              if [[ -n "$changed" ]]; then
                echo "::error file=libs/$lib/conanfile.py::libs/$lib changed but its version $v equals the latest release $lib/v$latest; bump it in this PR"
                fail=1
              fi
            fi
          done
          exit $fail
      # The native macOS/Windows jobs and publish.yml install Conan, CMake,
      # and Ninja themselves, at the versions in the env blocks of the
      # workflows. Those must equal the versions image/Dockerfile puts in the
      # dev image, so every platform builds with the same tools.
      - name: Tool versions match image/Dockerfile
        run: |
          fail=0
          docker_arg() { sed -n "s/^ARG $1=//p" image/Dockerfile; }
          for tool in CONAN_VERSION CMAKE_VERSION NINJA_VERSION; do
            want=$(docker_arg "$tool")
            have=$(printenv "$tool")
            if [[ "$want" != "$have" ]]; then
              echo "::error file=.github/workflows/ci.yml::$tool is $have here but $want in image/Dockerfile"
              fail=1
            fi
          done
          pub=$(sed -n 's/^  CONAN_VERSION: *//p' .github/workflows/publish.yml)
          if [[ "$pub" != "$(docker_arg CONAN_VERSION)" ]]; then
            echo "::error file=.github/workflows/publish.yml::CONAN_VERSION is $pub here but $(docker_arg CONAN_VERSION) in image/Dockerfile"
            fail=1
          fi
          exit $fail

  linux:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        profile: [linux-gcc14, linux-clang19]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and test every library (dependencies from the cache)
        run: scripts/build.sh all ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --profile ${{ matrix.profile }}

  sanitize:
    name: ASan + UBSan
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: scripts/build.sh all asan --profile linux-clang19

  tidy:
    name: clang-tidy
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      - run: scripts/build.sh all debug --profile linux-clang19
      - name: run-clang-tidy over every library's compile_commands.json
        run: |
          for lib in $LIBS; do
            echo "==> libs/$lib"
            run-clang-tidy -p "libs/$lib/build/Debug" -warnings-as-errors='*' -quiet
          done

  cppcheck:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      - run: scripts/build.sh all debug --profile linux-clang19
      # Second static analyzer alongside clang-tidy: different engine,
      # different defect classes. Driven by each compile_commands.json so it
      # analyzes exactly the translation units CMake compiles.
      # --library=googletest teaches cppcheck gtest's TEST() macros; without
      # it the test files are unparseable (syntaxError).
      - name: cppcheck over every library's compile_commands.json
        run: |
          for lib in $LIBS; do
            echo "==> libs/$lib"
            cppcheck --project="libs/$lib/build/Debug/compile_commands.json" \
              --library=googletest \
              --enable=warning,style,performance,portability \
              --error-exitcode=1 --quiet
          done

  package:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      # The one gate that exercises each Conan recipe end to end: export the
      # sources, build, run the tests, and package via cmake --install. In
      # dependency order, so a dependent packages against the just-packaged
      # form of its dependencies. This is what publishing relies on.
      - name: conan create every library in dependency order
        run: |
          for lib in $LIBS; do
            echo "==> libs/$lib"
            conan create "libs/$lib" --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release
          done

  plain-cmake:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      # Decision 6: every library is consumable with plain CMake and no
      # package manager. No other gate takes that path (the package job goes
      # through Conan's generated configs), so a broken installed package
      # config would otherwise ship unnoticed. Install every library into one
      # prefix in dependency order, so a dependent's find_package resolves
      # the dependency the way a consumer's would.
      - name: Install every library to a prefix with plain CMake
        run: |
          prefix=$RUNNER_TEMP/ndof-prefix
          for lib in $LIBS; do
            echo "==> libs/$lib"
            cmake -S "libs/$lib" -B "$RUNNER_TEMP/build-$lib" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DNDOF_BUILD_TESTS=OFF \
              -DCMAKE_PREFIX_PATH="$prefix"
            cmake --build "$RUNNER_TEMP/build-$lib"
            cmake --install "$RUNNER_TEMP/build-$lib" --prefix "$prefix"
          done
      # A scratch consumer that find_package()s every library from the prefix
      # and calls into each, built with nothing but CMake and the prefix.
      - name: Build and run a scratch consumer against the prefix
        run: |
          prefix=$RUNNER_TEMP/ndof-prefix
          c=$RUNNER_TEMP/consumer
          mkdir -p "$c"
          {
            echo 'cmake_minimum_required(VERSION 3.28)'
            echo 'project(consumer LANGUAGES CXX)'
            echo 'add_executable(consumer main.cpp)'
            echo 'target_compile_features(consumer PRIVATE cxx_std_23)'
            for lib in $LIBS; do
              echo "find_package(ndof-$lib REQUIRED CONFIG)"
              echo "target_link_libraries(consumer PRIVATE ndof::$lib)"
            done
          } > "$c/CMakeLists.txt"
          {
            for lib in $LIBS; do echo "#include <ndof/$lib/version.hpp>"; done
            echo '#include <iostream>'
            echo 'int main() {'
            for lib in $LIBS; do
              echo "  std::cout << ndof::$lib::library_name() << ' ' << ndof::$lib::library_version() << std::endl;"
            done
            echo '  return 0;'
            echo '}'
          } > "$c/main.cpp"
          cmake -S "$c" -B "$c/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$c/build"
          "$c/build/consumer"

  # New libraries are created from scripts/library-skeleton by
  # scripts/new-library.sh. Stamp a scratch library and run the gates on it,
  # so if the real libraries drift from the skeleton, we catch the failure
  # early and can fix it, before the next person needs it to print a new
  # library. The scratch library exists only in this
  # job's checkout.
  new-library:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Stamp a scratch library from the skeleton
        run: |
          scripts/new-library.sh scratch "Scratch library stamped by CI"
          if grep -rn "__NAME\|__DESCRIPTION" libs/scratch; then
            echo "::error::placeholders left in the stamped library"; exit 1
          fi
          if find libs/scratch -name '*__*' | grep .; then
            echo "::error::placeholder left in a file or directory name"; exit 1
          fi
          if ! grep -q "PathMatch: libs/scratch/" .clangd; then
            echo "::error::no .clangd fragment was added"; exit 1
          fi
      - name: Run the gates on the scratch library
        run: |
          scripts/build.sh scratch debug --profile linux-clang19
          find libs/scratch/include libs/scratch/src libs/scratch/tests -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run -Werror
          grep -qxF "#ifndef NDOF_SCRATCH_VERSION_HPP" libs/scratch/include/ndof/scratch/version.hpp
          run-clang-tidy -p libs/scratch/build/Debug -warnings-as-errors='*' -quiet
          cppcheck --project=libs/scratch/build/Debug/compile_commands.json \
            --library=googletest \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 --quiet
          conan create libs/scratch --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release

  # A change to the image definition is tested before it merges: build the
  # candidate image from this commit (amd64 only, never published) and run
  # the libraries' whole pipeline inside it. The other jobs cannot do this;
  # they run in the already-published image pinned in devcontainer.json.
  # The job always runs so it can be a required check, and does the work
  # only when the image definition, the Conan profiles, or the workflow that
  # publishes them changed.
  image-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the commit this change is based on is available
          # to compare against.
          fetch-depth: 0
      - name: Did the image definition change?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            range="origin/$BASE_REF...HEAD"
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range=""
          fi
          if [[ -z "$range" ]]; then
            echo "no base to compare against; testing the image"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git diff --name-only "$range" -- image conan/profiles .github/workflows/build-image.yml)" ]]; then
            echo "image definition changed; testing the candidate"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "image definition unchanged; nothing to test"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the candidate image
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: ndof-dev:candidate
      # Root inside the container for the same reason as the other container
      # jobs: the checkout belongs to the runner's user.
      - name: Build, test, sanitize, analyze, and package every library in the candidate
        if: steps.changed.outputs.run == 'true'
        run: |
          docker run --rm --user root -v "$PWD:/w" -w /w ndof-dev:candidate bash -c '
            set -e
            git config --global --add safe.directory /w
            scripts/build.sh all debug
            scripts/build.sh all release --profile linux-clang19
            scripts/build.sh all asan --profile linux-clang19
            scripts/build.sh all debug --profile linux-clang19
            git ls-files "*.cpp" "*.hpp" | xargs -r clang-format --dry-run -Werror
            for lib in $(scripts/build.sh --list); do
              run-clang-tidy -p "libs/$lib/build/Debug" -warnings-as-errors="*" -quiet
              cppcheck --project="libs/$lib/build/Debug/compile_commands.json" --library=googletest --enable=warning,style,performance,portability --error-exitcode=1 --quiet
            done
            for lib in $(scripts/build.sh --list); do
              conan create "libs/$lib" --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release
            done
          '

  macos:
    runs-on: macos-15 # arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        # Into a venv on the PATH, mirroring the dev image's /opt/toolchain;
        # GITHUB_PATH takes effect from the next step onward.
        run: |
          python3 -m venv "$HOME/toolchain"
          "$HOME/toolchain/bin/pip" install "conan==$CONAN_VERSION" "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"
          echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"
      - run: conan profile detect --force
      - run: scripts/build.sh all release

  windows:
    runs-on: windows-2022 # MSVC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Library build order
        # Computed by scripts/build.sh from each conanfile's requires, so CI
        # never carries its own copy of the list.
        shell: bash
        run: echo "LIBS=$(scripts/build.sh --list | xargs)" >> "$GITHUB_ENV"
      - name: Install pinned tools
        # Into a venv on the PATH, matching the macOS job; on Windows the
        # venv's executables live in Scripts, not bin.
        run: |
          python -m venv "$env:USERPROFILE\toolchain"
          & "$env:USERPROFILE\toolchain\Scripts\pip.exe" install "conan==$env:CONAN_VERSION" "cmake==$env:CMAKE_VERSION" "ninja==$env:NINJA_VERSION"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\toolchain\Scripts"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: conan profile detect --force
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      # Force the Ninja generator: Conan's detected MSVC default is a
      # multi-config generator, whose cmake_layout writes build/generators;
      # our presets expect the single-config layout (build/<Type>/generators)
      # used on every other platform. Each library is built and tested in
      # place, then packaged into the cache for the libraries after it.
      - name: Build, test, and package every library in dependency order
        run: |
          $conf = "-c", "tools.cmake.cmaketoolchain:generator=Ninja"
          foreach ($lib in $env:LIBS.Split(" ")) {
            Write-Host "==> libs/$lib"
            Push-Location "libs/$lib"
            conan install . --build=missing -s build_type=Release -s compiler.cppstd=23 @conf
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --preset release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build --preset release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            ctest --preset release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Pop-Location
            conan create "libs/$lib" --build=missing -s build_type=Release -s compiler.cppstd=23 -c tools.build:skip_test=True @conf
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
